[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # GA4 (G-CS0Z297CZP) is now loaded through Google Tag Manager, not directly in the code.
  PUBLIC_GTM_ID = "GTM-KQRT5HZM"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
