[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  PUBLIC_GA_ID = "G-CS0Z297CZP"
  PUBLIC_GTM_ID = "GTM-KQRT5HZM"

[[headers]]
